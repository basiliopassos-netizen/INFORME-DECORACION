<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Fábrica</title>
    <!-- Tailwind CSS para un diseño moderno y responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js para la reactividad de las pestañas y el CRUD -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col justify-between" x-data="fabricaApp()">

    <!-- Header Principal -->
    <header class="bg-slate-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2 cursor-pointer" @click="activeTab = 'inicio'">
                <i class="fa-solid fa-industry text-blue-400"></i> Control de Fábrica
            </h1>
            <div class="mt-2 sm:mt-0 flex flex-wrap gap-2 items-center">
                <!-- Botones de Copia de Seguridad general -->
                <button @click="exportarRespaldoJSON()" class="bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1 transition shadow" title="Guardar copia de seguridad de todos los datos">
                    <i class="fa-solid fa-cloud-arrow-down"></i> Exportar Copia
                </button>
                <label class="bg-purple-600 hover:bg-purple-700 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1 transition shadow cursor-pointer" title="Restaurar copia de seguridad en otro PC">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Importar Copia
                    <input type="file" @change="importarRespaldoJSON($event)" accept=".json" class="hidden">
                </label>

                <button @click="enviarWhatsAppDirecto()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition shadow">
                    <i class="fa-brands fa-whatsapp text-base"></i> WhatsApp
                </button>
                <button @click="exportarPDF()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition shadow">
                    <i class="fa-solid fa-file-pdf text-base"></i> PDF / Imprimir
                </button>
            </div>
        </div>
    </header>

    <!-- Navegación Superior -->
    <nav class="bg-white shadow border-b overflow-x-auto" x-show="activeTab !== 'inicio'">
        <div class="max-w-7xl mx-auto flex items-center justify-between px-4">

                    <i class="fa-solid fa-gears"></i> Producción
                </button>
                <button @click="activeTab = 'decoracion'" :class="activeTab === 'decoracion' ? 'border-blue-600 text-blue-600 font-bold bg-blue-50/50' : 'border-transparent text-gray-500 hover:text-gray-700'" class="py-3 px-3 text-center border-b-2 font-medium text-xs sm:text-sm transition flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-paint-roller"></i> Decoración
                </button>
                <button @click="activeTab = 'corte'" :class="activeTab === 'corte' ? 'border-blue-600 text-blue-600 font-bold bg-blue-50/50' : 'border-transparent text-gray-500 hover:text-gray-700'" class="py-3 px-3 text-center border-b-2 font-medium text-xs sm:text-sm transition flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-scissors"></i> Corte
                </button>
                <button @click="activeTab = 'cunas'" :class="activeTab === 'cunas' ? 'border-blue-600 text-blue-600 font-bold bg-blue-50/50' : 'border-transparent text-gray-500 hover:text-gray-700'" class="py-3 px-3 text-center border-b-2 font-medium text-xs sm:text-sm transition flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-box-archive"></i> Cunas
